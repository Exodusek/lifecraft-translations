trivia:
  item_ribosome:
  - Rybosomy bakterii roznia sie od naszych, dlatego antybiotyki moga zabijac bakterie, nie szkodzac nam.
  item_catalyzer:
  - Enzymy sa w stanie przyspieszyc reakcje chemiczne nawet ponad milion razy.
  item_phospholipid:
  - "Fosfolipidy to szczegolne lipidy, ktore sa amfifilowe, czyli zarowno hydrofilowe, jak i lipofilowe."
  - Fosfolipidy sa kluczowym skladnikiem blon komorkowych, ukladaja sie w podwojna warstwe lipidowa.
  zone_cytosol:
  - Cytozol to plyn, w ktorym unosza sie wszystkie organelle zawarte w komorce.
  item_luciferin:
  - Lucyferyny w naturze to klasa malych czasteczek uzywanych przez wiele form zycia do generowania bioluminescencji. Swietliki, slimaki, bakterie, a nawet niektore grzyby.
  item_myosin:
  - Miozyna to bialko motoryczne, ktore oddzialuje z filamentami aktyny, generujac ruch w komorkach, jest odpowiedzialne za skurcz miesni.
  item_connexon:
  - Koneksony pozwalaja komorkom komunikowac sie bezposrednio, bez potrzeby wysylania sygnalow do przestrzeni zewnatrzkomorkowej. To tak, jakby komorki mialy wlasna „tajna siec szeptow” do przekazywania informacji i zasobow cicho i efektywnie.

tips:
- To nie jest mod do Factorio.
- Tlen jest uwzgledniony.
- Mozesz przytrzymac SHIFT, aby podniesc wiele przedmiotow.
- Jednorazowe przedmioty nie wypadaja po zniszczeniu.
- Mitochondria SA elektrownia komorki!
- Mikrotubule moga transportowac przedmioty w dowolnym kierunku.
- Wyrzutniki przedmiotow moga byc uzywane do wymuszania kierunku przedmiotow.
- Niektore struktury generuja cieplo podczas pracy.
- Chwytaki mozna obracac i odwracac.
- Nie martw sie, jesli przegrasz, zawsze mozesz zaczac od nowa!
- Nie zapomnij monitorowac temperatury!
- Sprawdź poradnik w grze, jesli potrzebujesz pomocy!
- Niektore ewolucje moga wymagac odkrycia dodatkowych bialek.
- Niektore przedmioty mozna zlozyc, upuszczajac jeden na drugi.
- Uzyj warsztatu, aby przyspieszyc pierwsze tworzenia.
- To sa bialka, nie ksztalty!
- Mozesz uzyc balanserow do dzielenia lub laczenia pasow.
- Pokaz nam swoje kreacje na Discordzie!
- Cialo musi rosnac.
- Niektore dryfujace zasoby beda sie ciagle pojawiac na zewnatrz.
- Mozesz przesuwac dowolne okno, przeciagajac je prawym przyciskiem myszy.
- Tak, nie ma interaktywnego tutoriala, powodzenia!
- Nie ma ekwipunku, sprobuj zautomatyzowac umieszczanie budynkow!
- Mozesz przeciagnac prostokat, aby podniesc wiele przedmiotow.
