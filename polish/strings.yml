  item_description_subunit_green: To <a>bialko</a> moze byc zlozone do produkcji struktur
  item_description_subunit_yellow: To <a>bialko</a> moze byc zlozone do produkcji struktur

  item_description_oxygen: <a>Tlen</a> to gaz uzywany wewnatrz mitochondrium do akceptowania elektronow
  item_description_carbon_dioxide: <a>Dwutlenek wegla</a> to gaz, ktory jest produktem odpadowym reakcji produkujacych energie
  item_description_glucose: <a>Glukoza</a> to weglowodan uzywany w glikolizie do produkcji energii
  item_description_pyruvate: <a>Pirogronian</a> to koncowy produkt glikolizy, moze byc przekształcony w <a>Acetylo-CoA</a>
  item_description_acetyl_coa: <a>Acetylo-CoA</a> jest uzywany jako substrat do cyklu Krebsa do generowania <a>NADH</a>

  item_description_dispatcher_subunit: To <a>bialko</a> moze byc zlozone do produkcji <a>dyspozytora</a>
  item_description_atp_synthase_subunit: To <a>bialko</a> jest uzywane do składania <a>syntazy ATP</a>
  item_description_connexin: To <a>bialko</a> jest uzywane do składania <a>koneksonu</a>
  item_description_thermogenin: To <a>bialko</a> jest uzywane do składania <a>Rozlączacza</a>
  item_description_actin_g: "<a>G-Aktyna</a> jest elementem budulcowym filamentu aktynowego"
  item_description_actin_f: "<a>Aktyna</a> to bialko wielozadaniowe uzywane do aktywnych czesci komorki"
  item_description_myosin: "<a>Miozyna</a> to funkcjonalne bialko uzywane do skurczu miesni"
  item_description_alpha_helix: <a>Spirala alfa</a> to ogolne bialko strukturalne
  item_description_beta_sheet: <a>Arkusz beta</a> to ogolne bialko strukturalne
  item_description_kinesin: <a>Kinezyna</a> to bialko zaangazowane w struktury, ktore moga filtrowac przedmioty
  item_description_vimentin: <a>Wimentyna</a> to bialko uzywane do struktur magazynujacych
  item_description_collagen_chain_red: <a>Czerwony lancuch kolagenu</a> to bialko uzywane do produkcji tkanek zewnatrzkomorkowych
  item_description_collagen_chain_blue: <a>Niebieski lancuch kolagenu</a> to bialko uzywane do produkcji tkanek zewnatrzkomorkowych
  item_description_cytochrome: "<a>Cytochromy</a> to bialka, ktore sa uzywane wewnatrz niektorych enzymow lub do składania <a>lancucha transportu elektronow</a>"
  item_description_atp: "<a>ATP</a> to naładowana czasteczka, ktora moze dostarczyc energii dla wszystkich procesow zyciowych"
  item_description_adp: "<a>ADP</a> to nienaładowana czasteczka, ktora moze byc przekształcona z powrotem w <a>ATP</a> i ponownie uzyta do dostarczenia energii"
  item_description_mega_atp: "<a>Mega ATP</a> to zlozona czasteczka <a>ATP</a> uzywana do zasilania <a>stacji energetycznych</a> do produkcji energii zewnatrzkomorkowej"
  item_description_mega_adp: "<a>Mega ADP</a> to zlozona nienaładowana czasteczka <a>ADP</a> uzywana w produkcji energii zewnatrzkomorkowej"
  item_description_adenine: "<a>Adenina</a> to nukleotyd, uzywany do ewolucji i syntezy innych czasteczek"
  item_description_thymine: "<a>Tymina</a> to nukleotyd, uzywany do ewolucji i syntezy innych czasteczek"
  item_description_guanine: "<a>Guanina</a> to nukleotyd, uzywany do ewolucji i syntezy innych czasteczek"
  item_description_cytosine: "<a>Cytozyna</a> to nukleotyd, uzywany do ewolucji i syntezy innych czasteczek"
  item_description_uracil: "<a>Uracyl</a> to nukleotyd, uzywany do ewolucji i syntezy innych czasteczek"
  item_description_base_pair_cg: "<a>Pary zasad</a> to podstawowe cegielki DNA, uzywane do ewolucji"
  item_description_base_pair_at: "<a>Pary zasad</a> to podstawowe cegielki DNA, uzywane do ewolucji"
  item_description_base_pair_au: "<a>Pary zasad</a> to podstawowe cegielki DNA, uzywane do ewolucji"
  item_description_phospholipid: "<a>Fosfolipid</a> to specjalny rodzaj lipidu, ktory jest uzywany do budowania blon komorkowych."
  item_description_hemoglobin: "<a>Hemoglobina</a> to bialko przenoszace tlen zawarte w <a>Czerwonej Krwince</a>"
  item_description_plasmid_1: <a>Plazmid</a> jest uzywany wewnatrz <a>ewolwerow</a> do odblokowywania nowych odkryc
  item_description_plasmid_2: <a>Plazmid</a> jest uzywany wewnatrz <a>ewolwerow</a> do odblokowywania nowych odkryc
  item_description_microtubule: "<a>Mikrotubule</a> to glowny sposob transportu przedmiotow w <a>wewnatrzkomorkowych</a> strefach"
  item_description_microtubule_primitive: "<a>Prymitywne mikrotubule</a> to bardzo wolny sposob transportu przedmiotow w <a>wewnatrzkomorkowych</a> strefach"
  item_description_microtubule_advanced: "<a>Zaawansowane mikrotubule</a> to szybki sposob transportu w <a>wewnatrzkomorkowych</a> strefach"

  item_description_acid_hydrolase_enzyme: Enzym niezbedny do wytworzenia katabolizatorow

  item_description_luciferase_enzyme: "<a>Lucyferaza</a> to enzym zdolny do zmiany <a>lucyferyny</a> i sprawienia, ze emituje swiatlo"
  item_description_luciferin: "<a>Lucyferyna</a> to czasteczka, ktora moze emitowac swiatlo, gdy jest przetwarzana przez enzym <a>lucyferaze</a>"
  item_description_biolamp_primitive: "<a>Prymitywna biolampa</a> moze emitowac swiatlo przez jakis czas, przetwarzajac <a>tlen</a> i <a>lucyferyne</a>"
  item_description_biolamp: "<a>Biolampa</a> to bardziej zaawansowana forma swiatla, ktora moze bezposrednio uzywac energii wewnatrzkomorkowej do produkcji swiatla"

  item_description_item_kicker: <a>Wypychacz przedmiotow</a> moze byc umieszczony nad <a>mikrotubula</a>, aby wymusic okreslony kierunek dla przedmiotow przechodzacych obok
  item_description_item_tunnel: <a>Tunel przedmiotow</a> moze przemieszczac przedmioty pod ziemia, dwa tunele musza byc wyrównane, aby dzialac poprawnie
  item_description_item_tunnel_advanced: <a>Zaawansowany tunel przedmiotow</a> moze przemieszczac przedmioty pod ziemia, dwa tunele musza byc wyrównane, aby dzialac poprawnie
  item_description_item_tunnel_primitive: <a>Prymitywny tunel przedmiotow</a> moze przemieszczac przedmioty pod ziemia, dwa tunele musza byc wyrównane, aby dzialac poprawnie
  item_description_workbench: <a>Stol roboczy</a> to struktura, ktora moze składac bialka, ale moze byc uzywana tylko recznie
  item_description_evolver: <a>Ewolwer</a> to struktura uzywana do odkrywania nowych technologii poprzez konsumpcje <a>nukleotydow</a>
  item_description_ribosome: <a>Rybosom</a> to struktura, ktora moze produkowac <a>bialka</a> poprzez składanie <a>aminokwasow</a>
  item_description_catalyzer: <a>Katalizator</a> to struktura, ktora przekształca niektóre przedmioty wejsciowe w niektóre przedmioty wyjsciowe, wymaga <a>enzymu</a> do dzialania
  item_description_assembler: <a>Montazysta</a> to struktura, ktora moze składac <a>bialka</a> w gotowe produkty, takie jak budynki lub tkanki
  item_description_catabolyzer: <a>Katabolizator</a> to struktura, ktora moze rozkladac przedmioty na ich surowe skladniki
  item_description_dna_nuclease: <a>Nukleaza DNA</a> to struktura, ktora moze rozkladac <a>plazmidy</a> na <a>nukleotydy</a>, ktore moga byc uzywane do ewolucji
  item_description_stockpile2x: <a>Magazyn</a> moze byc uzywany jako bufor do przechowywania niektórych przedmiotow
  item_description_stockpile1x: <a>Malutki magazyn</a> moze byc uzywany jako bufor do przechowywania kilku przedmiotow
  item_description_stockpile4x: <s>Ogromny magazyn</s>, ktory moze przechowywac duzo przedmiotow
  item_description_stockpile_filter2x: <a>Magazyn</a>, ktory moze byc ustawiony do akceptowania tylko okreslonych przedmiotow
  item_description_stasher: <a>Przechowywacz</a> moze umieszczac dozwolone przedmioty, takie jak mikrotubule lub wypychacze przedmiotow, bezposrednio w schowku bez koniecznosci interakcji z nimi
  item_description_membrane_transporter1x: <a>Transporter blonowy</a> jest w stanie transportowac okreslone przedmioty przez blone w okreslonym kierunku
  item_description_membrane_transporter2x: <a>Kotransporter blonowy</a> jest w stanie transportowac dwa przedmioty przez blone razem lub poprzez ich wymiane
  item_description_connexon: <a>Konekson</a> jest w stanie sparowac sie z innym koneksonem, aby stworzyc luke miedzy dwoma roznymi strefami wewnatrzkomorkowymi, co pozwala na transport przedmiotow
  item_description_atp_synthase: <a>Syntaza ATP</a> moze uzywac energii produkowanej przez pobliski <a>lancuch transportu elektronow</a> wewnatrz mitochondrium do ładowania <r>ADP</r> do <r>ATP</r>
  item_description_electron_transport_chain: <a>Lancuch transportu elektronow</a> moze ładowac pobliskie <a>syntazy ATP</a> lub zasilac <a>rozlączacze</a>, aby produkowac cieplo poprzez utlenianie <r>NADH</r> do <r>NAD</r> i zuzywanie <r>Tlenu</r>
  item_description_decoupler: <a>Rozlączacz</a> moze uzywac energii produkowanej przez pobliski <a>lancuch transportu elektronow</a> do generowania ciepla
  item_description_energy_supplier_mk1: <a>Dostawca energii</a> jest w stanie dystrybuowac energie generowana przez spalanie <r>ATP</r> do <r>ADP</r> do pobliskich budynkow wewnatrzkomorkowych, nie jest jednak zbyt wydajny; moze łaczyc sie z innymi dostawcami, aby zwiekszyc zasieg
  item_description_energy_supplier_mk2: <a>Dostawca energii Mk2</a> jest w stanie dystrybuowac energie generowana przez spalanie <r>ATP</r> do <r>ADP</r> do pobliskich budynkow wewnatrzkomorkowych; moze łaczyc sie z innymi dostawcami, aby zwiekszyc zasieg
  item_description_energy_pole: <a>Slup energetyczny</a> jest przydatny do transportu energii generowanej przez dostawcow dalej w porównaniu do normalnych dostawcow
  item_description_energy_station: <a>Stacja energetyczna</a> jest w stanie dystrybuowac energie do struktur zewnatrzkomorkowych przez slupy
  item_description_energy_pole_extracellular: <a>Slup energetyczny zewnatrzkomorkowy</a> jest przydatny do transportu energii na zewnatrz komorek
  item_description_cytostome1x: <a>Maly cytostom</a> moze pobierac przedmioty z zewnatrz. Musi byc umieszczony na blonie skierowanej na zewnatrz. Nie wymaga energii do dzialania.
  item_description_cytostome2x: <a>Cytostom</a> moze pobierac przedmioty z zewnatrz. Musi byc umieszczony na blonie skierowanej na zewnatrz. Jest szybszy niz <a>maly cytostom</a>, ale wymaga energii do dzialania
  item_description_disposer1x: <a>Maly usuwacz</a> jest uzywany do pozbywania sie przedmiotow przez wyrzucanie ich na zewnatrz komorki. Nie wymaga energii do dzialania
  item_description_disposer2x: <a>Usuwacz</a> jest uzywany do pozbywania sie przedmiotow przez wyrzucanie ich na zewnatrz komorki. Jest lepszy niz <a>maly usuwacz</a>, ale wymaga energii do dzialania
  item_description_dispatcher: <a>Dyspozytor</a> jest uzywany do wysylania materialow do rosnących obszarow lub do budynkow, ktore musza byc zbudowane na zewnatrz komorek
  item_description_dispatcher_primitive: ~item_description_dispatcher
  item_description_diffuser: <a>Dyfuzor</a> jest w stanie dostarczac materialy lokalnie, moze umieszczac budynki na miejscach, zastępowac utlenione budynki, leczyc zainfekowane kafelki poprzez dostarczanie tkanek
  item_description_diffuser_primitive: ~item_description_diffuser
  item_description_retriever: <a>Pobieracz</a> jest w stanie pobierac unoszące sie przedmioty wewnatrz twojego organizmu
  item_description_retriever_primitive: ~item_description_retriever

  item_description_mitochondrial_membrane: "<a>Błona mitochondrialna</a> jest uzywana do budowania mitochondriow wewnatrz stref wewnatrzkomorkowych"
  item_description_lysosomal_membrane: "<a>Błona lizosomalna</a> jest uzywana do budowania lizosomow wewnatrz stref wewnatrzkomorkowych"
  item_description_collagen_scaffold: To jest podstawowa tkanka zewnatrzkomorkowa, ktora moze produkowac rusztowanie dla bardziej zaawansowanych tkanek do wzrostu
  item_description_cytoskeleton_scaffold: To podstawowe rusztowanie jest wymagane do budowania tkanek wewnatrzkomorkowych na nim
  item_description_endothelium: <a>Srodblonek</a> to wewnetrzna wyściółka wszystkich naczyn krwionosnych
  item_description_smooth_muscular_tissue: <a>Tkanka gladka miesniowa</a> to rodzaj tkanki kurczliwej uzywanej do budowania wszelkiego rodzaju naczyn
  item_description_staminal_intracellular_tissue: <a>Tkanka macierzysta</a> to specjalny rodzaj niezrożnicowanej tkanki, ktora moze produkowac wszystkie inne rodzaje tkanek
  item_description_collagen_flooring: <a>Podloga kolagenowa</a> to tkanka zewnatrzkomorkowa, ktora moze zapewnic wsparcie dla wszelkiego rodzaju naczyn
  item_description_cell_membrane: To jest podstawowa niezrożnicowana tkanka wewnatrzkomorkowa uzywana do rozszerzania twojego poczatkowego organizmu
  item_description_sparkling_tissue: Ta specjalna tkanka jest uzywana do budowania struktur energetycznych zewnatrzkomorkowych

  item_description_small_intestine_intracellular_tissue: Ta tkanka jest w stanie absorbowac skladniki odzywcze z naczyn jelitowych i produkowac podstawowe prymitywne enzymy do trawienia pokarmu
  item_description_small_intestine_extracellular_tissue: Ta tkanka jest niezbedna do hostowania <a>zbiornikow</a>, ktore sa uzywane do trawienia pokarmu w skladniki odzywcze, ktore moga byc absorbowane

  item_description_uniporter_glucose: Ten transporter jest w stanie transportowac glukoze przez blony
  item_description_uniporter_gas: Ten transporter jest w stanie przemieszczac gaz przez blony
  item_description_uniporter_aminoacid: Ten transporter jest w stanie transportowac aminokwasy przez blony
  item_description_uniporter_lipid: Ten transporter jest w stanie transportowac lipidy przez blony
  item_description_uniporter_enzyme: Ten transporter jest w stanie transportowac enzymy na zewnatrz komorek, co jest przydatne do wysylania enzymow trawiennych do przetwarzania skladnikow odzywczych
  item_description_uniporter_pyruvate: Ten transporter jest w stanie transportowac <a>Pirogronian</a> przez blone
  item_description_uniporter_lysosome_inward: Ten transporter moze przemieszczac przedmioty do rozlozenia do <a>lizosomow</a>
  item_description_uniporter_lysosome_outward: Ten transporter moze przemieszczac surowe skladniki na zewnatrz <a>lizosomow</a>
  item_description_antiporter_atp_adp: Ten antiporter jest w stanie wymieniac <a>ATP</a> i <a>ADP</a> przez blone
  item_description_antiporter_nadh_nad: Ten antiporter jest w stanie wymieniac <a>NADH</a> i <a>NAD</a> przez blone

  item_description_launcher1x: "<a>Mala wyrzutnia</a> jest uzywana do rzucania defensyn w bakterie. Nie wymaga energii do dzialania"
  item_description_launcher2x: "<a>Wyrzutnia</a> jest uzywana do rzucania defensyn w bakterie. Wymaga energii, ale ma wyzsza szybkostrzelnosc w porównaniu do <a>malej wyrzutni</a>"
  item_description_defensin_theta: "<a>θ-defensyna</a> to bialko, ktore moze byc uzywane do zabijania <a>Bakterii</a>. Musi byc rzucane przez <a>wyrzutnie</a>"
  item_description_protease: "Ta proteaza moze byc uzywana do rozkladania rusztowan lub kolonii bakteryjnych, musi byc transportowana przez <a>dyspozytora</a>"

  item_description_capillary: <a>Kapilary</a> to najcieńsze naczynia krwionosne. Sa w stanie wymieniac zawartosc z zewnatrz i musza byc podlaczone od <a>tetnicy</a> do <a>zyły</a>, aby zapewnic przeplyw krwi
  item_description_artery1x1: <a>Tetnice</a> moga transportowac krew z <a>serc</a> wokół tkanek zewnatrzkomorkowych
  item_description_artery2x2: <a>Tetnice</a> moga transportowac krew z <a>serc</a> wokół tkanek zewnatrzkomorkowych
  item_description_artery4x4: <a>Tetnice</a> moga transportowac krew z <a>serc</a> wokół tkanek zewnatrzkomorkowych

  item_description_perforator_vessel1x1: <a>Naczynia perforujace</a> moga łaczyc dwa naczynia tego samego typu z podziemnym połaczeniem, aby pomoc w przecinaniu wielu linii
  item_description_perforator_vessel2x2: ~item_description_perforator_vessel1x1
  item_description_perforator_vessel4x4: ~item_description_perforator_vessel1x1

  item_description_stoma: <a>Stoma</a> to struktura, ktora moze absorbowac duzo zasobow z <a>klastrow</a> w pustce, to najbardziej prymitywny zbieracz układu trawiennego
  item_description_primordial_anus: <a>Prymitywny odbyt</a> to struktura uzywana do pozbywania sie odpadkow lub nieprzetworzonych przedmiotow z trawienia
  item_description_tank: <a>Zbiorniki</a> to ogolne pojemniki, ktore moga byc uzywane do przetwarzania substancji w strefach zewnatrzkomorkowych
  item_description_ileum1x1: <a>Naczynia jelita krętego</a> moga transportowac skladniki odzywcze w układzie trawiennym
  item_description_ileum2x2: ~item_description_ileum1x1
  item_description_ileum4x4: ~item_description_ileum1x1

  item_description_tissue_matrix: <a>Macierz tkankowa</a> to struktura zewnatrzkomorkowa, ktora moze byc uzywana do przechowywania duzej ilosci tej samej tkanki.

  item_description_valve1x1: <a>Zawory</a> moga byc uzywane do recznego blokowania tranzytu miedzy naczyniami
  item_description_valve2x2: ~item_description_valve1x1
  item_description_valve4x4: ~item_description_valve1x1

  item_description_secretor: <a>Wydzielacz</a> jest uzywany jako punkt startowy, ktory wypycha enzymy przez przewody w kierunku <a>zbiornikow</a>
  item_description_duct1x1: <a>Przewody</a> sa uzywane do transportu enzymow produkowanych w tkankach wewnatrzkomorkowych w kierunku <a>zbiornikow</a>
  item_description_duct2x2: ~item_description_duct1x1
  item_description_duct4x4: ~item_description_duct1x1

  item_description_door_intracellular3x: Ta struktura moze byc otwierana i zamykana, aby pozwolic organizmom na przechodzenie

  item_description_nad_synthase_enzyme: "Ten enzym jest uzywany do syntezy <a>NAD+</a> i <a>NADH</a>"
  item_description_nad_nadp_transhydrogenase_enzyme: "Ten enzym jest uzywany do przenoszenia elektronow miedzy czasteczkami <a>NAD+</a> i <a>NADP+</a>"
  item_description_nucleobase_synthase_enzyme: Ten enzym jest uzywany do syntezy <a>nukleotydow</a> z surowych skladnikow
  item_description_alcohol_dehydrogenase: Ten enzym jest uzywany do przekształcania <a>pirogronianu</a> tam i z powrotem w <a>etanol</a>

  item_description_amilase_enzyme: Ten enzym jest w stanie rozkladac skrobie na glukoze
  item_description_proteinase_enzyme: Ten enzym jest w stanie rozkladac zlozone bialka na aminokwasy
  item_description_lipase_enzyme: Ten enzym jest w stanie rozkladac lipidy do formy przyswajalnej

  item_description_mega_atp_synthase_enzyme: Ten enzym jest uzywany do produkcji i recyklingu czasteczek <a>Mega-ATP</a> i <a>Mega-ADP</a>

  item_description_energy_drain: Niestandardowy odplyw energii, ktory moze byc uzywany do absorbowania energii wewnatrzkomorkowej
  item_description_black_box: Niestandardowa struktura, ktora moze przekształcac dowolny okreslony przedmiot w dowolny inny okreslony przedmiot
  item_description_heater: Niestandardowa struktura, ktora produkuje cieplo bez potrzeby energii

  item_description_cell_hemocyte: <a>Hemocyty</a> to najbardziej prymitywny rodzaj komorek odpornosciowych, moga poruszac sie na zewnatrz, aby eksplorowac otoczenie i atakowac bakterie.

  zone_description_cytosol: "<a>Cytosol</a> to niezrożnicowana strefa, ktora moze zawierac wszystkie podstawowe struktury zdolne do syntezy <a>bialek</a> i generowania <a>energii</a>"
  zone_description_extracellular_matrix: "<a>Tkanka łaczna</a> to strefa, ktora moze byc uzywana do transportu przez naczynia i rurki. Zaden specjalny budynek nie moze byc tutaj umieszczony"
  zone_description_lysosome: <a>Lizosom</a> to strefa, ktora moze byc uzywana do rozkladania przedmiotow na ich surowe materialy</a>"

  zone_layer_name_special: Specjalna
  zone_layer_name_intracellular: Wewnatrzkomorkowa
  zone_layer_name_extracellular: Zewnatrzkomorkowa
  zone_layer_name_internal: Wewnetrzna
  zone_layer_name_colony: Kolonia
  zone_layer_name_deposit: Zasoby

  zone_name_scaffold: Rusztowanie
  zone_name_cytoskeleton: Cytoszkielet
