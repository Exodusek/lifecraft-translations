  ui_main_menu_about_early_access_message: >
    Dziekujemy za zdecydowanie sie na wyprobowanie naszej gry!

    Ta gra jest o przetrwaniu, o rozpoczynaniu w pierwotnej zupie jako pojedyncza komorka i tworzeniu
    całego lancucha produkcyjnego potrzebnego do zycia!

    Nasza ostateczna wizja to ewolucja od prostej komorki do w pełni ssaczego stworzenia z organami:
    układ krwionosny, układ oddechowy, układ trawienny, układ nerwowy i tak dalej..
    wszystko to poprzez budowanie, rozszerzanie i ewoluowanie twojego poczatkowego organizmu!

    Baw sie dobrze z tym EA! Chcemy twojej opinii, wiec dolacz do naszego Discorda i znajdz nas tam. Potrzebujemy twojej pomocy :)

  ui_main_menu_about_pixbits_message: >
    Jesteśmy małym niezależnym studiem deweloperskim z siedziba we Włoszech!

    Jacopo Santoni - kod i projektowanie gry

    Silvio Eusebio - grafika, muzyka, efekty dzwiekowe

  ui_main_menu_about_credits_message: >
    Silnik audio: FMOD Studio by Firelight Technologies Pty Ltd.

    Dziekujemy wszystkim testerom, ktorzy wspierali nas podczas rozwoju tej gry. Dziekujemy za ich opinie i ich mapy!
