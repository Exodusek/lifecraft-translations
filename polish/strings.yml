  evolution_name_primitive_logistics: Prymitywna logistyka
  evolution_description_primitive_logistics: Odkryj <r>mikrotubule</r>, <r>pickery</r> i <r>cytostomy</r>, ktore sa uzywane do kierowania przedmiotow wewnatrz komorek i pobierania przedmiotow z zewnatrz
  evolution_description_transportation_basic: Odkryj nieutleniajace sie <r>mikrotubule</r> i <r>pickery</r>, odkryj <r>wypychacze przedmiotow</r>, uzywane do wymuszania kierunku na tubulach i <r>prymitywne tunele</r>

  evolution_name_energy_production_1: Glikoliza
  evolution_description_energy_production_1: Odkryj <r>glikolize</r>, ktora jest najprostszym sposobem produkcji energii

  evolution_name_energy_production_2: Metabolizm tlenowy
  evolution_description_energy_production_2: Odkryj metabolizm tlenowy, ktory zachodzi wewnatrz <r>mitochondriow</r> i jest w stanie wyprodukowac duzo energii lub ciepla

  evolution_name_energy_production_3: Generowanie ATP
  evolution_description_energy_production_3: Odkryj, jak naładowac <r>ADP</r> do <r>ATP</r> za pomoca energii generowanej przez <r>lancuch transportu elektronow</r>

  evolution_name_heat_production: Generowanie ciepla
  evolution_description_heat_production: Odkryj, jak generowac cieplo za pomoca energii generowanej przez <r>lancuch transportu elektronow</r>

  evolution_description_expansion: Odkryj, jak rozszerzyc swoja komorke
  evolution_description_intracellular_production: Odkryj <r>montazystow</r> i <r>katalizatory</r>, ktore sa uzywane do produkcji zlozonych obiektow lub katalizowania reakcji chemicznych

  evolution_description_alcoholic_fermentation: Odkryj fermentacje alkoholowa, sposob na przywrocenie <r>NAD</r> z <r>NADH</r> poprzez produkcje <r>etanolu</r>
  evolution_description_pyruvate_manipulation: Odkryj manipulacje pirogronianem, ktora jest niezbedna do produkcji czasteczek uzywanych w cyklu Krebsa

  evolution_description_evolution_1: Odkryj, jak rozlozyc i ponownie polaczyc nukleotydy w pary zasad
  evolution_description_tubulins: Odkryj <r>tubuliny</r>, ktore sa bialkami uzywanymi do produkcji mikrotubul, wypychaczy przedmiotow i wiekszosci podstawowych struktur
  evolution_description_subunits: Odkryj <r>podjednostki</r>, ktore sa duzymi bialkami skladanymi w struktury
  evolution_description_kinesin: Odkryj <r>kinezyne</r>, ktora jest uzywana do produkcji struktur filtrujacych przedmioty
  evolution_description_functional_proteins: Odkryj <r>Aktyne</r> i <r>wimentyne</r>, ktore sa bialkami uzywanymi do budowania dynamicznych i magazynujacych struktur
  evolution_description_advanced_routing: Odkryj <r>tunele</r> i <r>balansery</r>, ktore sa uzywane do optymalizacji kierowania i zarzadzania przedmiotami
  evolution_description_membrane_transportation: Odkryj <r>transportery blonowe</r>, ktore sa uzywane do transportu przedmiotow miedzy blonami komorkowymi
  evolution_description_mitochondrion: Odkryj <r>mitochondria</r>, specjalna strefe wewnatrzkomorkowa, ktora moze byc uzywana do produkcji ciepla i energii
  evolution_description_lysosome: Odkryj <r>lizosomy</r>, specjalna strefe wewnatrzkomorkowa, ktora moze byc uzywana do recyklingu i rozkladania przedmiotow

