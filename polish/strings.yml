  recipe_description_glycolysis: "<a>Glikoliza</a> to najprostszy sposob przechowywania energii poprzez przekształcanie <r>ADP</r> w <r>ATP</r>, wymaga <r>Glukozy</r>, ale nie <r>Tlenu</r>"
  recipe_description_alcohol_dehydrogenase: "<a>Dehydrogenaza alkoholowa</a> pozwala przekształcic <r>NADH</r> z powrotem w <r>NAD</r> poprzez produkcje <r>Etanolu</r> i <r>Dwutlenku wegla</r>"
  recipe_description_krebs_cycle: "<a>Cykl Krebsa</a> to zlozona reakcja, ktora zachodzi wewnatrz mitochondriow, to bardzo efektywny sposob redukcji <r>NAD</r> do <r>NADH</r> przy uzyciu <r>Acetylo-CoA</r> z innych szlakow metabolicznych."
  recipe_description_pyruvate_dehydrogenase: "<a>Dehydrogenaza pirogronianowa</a> to reakcja, ktora przyłącza <r>Pirogronian</r> uzyskany z glikolizy do produkcji <r>Acetylo-CoA</r>, ktory jest glownym substratem dla cyklu Krebsa"
  recipe_description_pyruvate_carboxylase: "<a>Karboksylaza pirogronianowa</a> to reakcja uzywana do syntezy <r>Szczawiooctanu</r> z <r>Pirogronianu</r> do uzycia w cyklu Krebsa"
  recipe_description_nad_nadp_transhydrogenase: "<a>Transhydrogenaza NAD-NADP</a> to reakcja uzywana do zamiany zredukowanych wersji <r>NAD</r> i <r>NADP</r>"
  recipe_description_pentose_phosphate_pathway: "<a>Szlak pentozofosforanowy</a> to szlak uzywany do produkcji <r>NADPH</r> i <r>Rybozy</r>, ktora jest uzywana do syntezy wielu czasteczek"
  recipe_description_nad_synthase: "<a>Syntaza NAD</a> jest uzywana do syntezy de novo <r>NAD</r>"
  recipe_description_nadp_synthase: "<a>Syntaza NADP</a> jest uzywana do przekształcania <r>NAD</r> w <r>NADP</r> poprzez zuzywanie energii"
  recipe_description_adp_synthase: "<a>Syntaza ADP</a> jest uzywana do syntezy de novo <r>ADP</r>"
  recipe_description_base_pair_ligase_enzyme: "Ten enzym jest w stanie połaczyc dwa komplementarne nukleotydy."
  recipe_description_mega_atp_synthase: Ta reakcja jest uzywana do produkcji <a>Mega-ATP</a> z pojedynczych czasteczek <a>ATP</a>. Jest uzywana do zasilania produkcji energii zewnatrzkomorkowej
  recipe_description_mega_adp_lyase: Ta reakcja jest uzywana do przekształcania <a>Mega-ADP</a> z powrotem w pojedyncze czasteczki <a>ADP</a>. Jest uzywana do ładowania odpadkow z produkcji energii zewnatrzkomorkowej

