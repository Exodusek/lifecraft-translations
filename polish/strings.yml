  ui_ruleset_description_sandbox: <n>Piaskownica</n> to tryb, w ktorym mozesz eksperymentowac i budowac swobodnie, ewolucja jest calkowicie odblokowana, mozesz umieszczac przedmioty za darmo, masz dostep do kreatywnych narzedzi do rozszerzania i budowania nowych stref.
  ui_ruleset_description_peaceful: <y>Pokojowy</y> to tryb, w ktorym grasz w spokojnym srodowisku, musisz tworzyc struktury i ewoluowac, ale nie musisz martwic sie o srodowisko, wiec nie ma wrogow i temperatury.
  ui_ruleset_description_survival: <r>Przetrwanie</r> to tryb, w ktorym musisz walczyc o przetrwanie, temperatura na zewnatrz bedzie powoli spadac i musisz byc gotowy z produkcja ciepla, kolonie bakterii beda rosly i atakowaly cie, jesli zblizysz sie do nich zbyt blisko.
  ui_ruleset_description_adventure: <H9538ff>Przygoda</H> to tryb, w ktorym kontrolujesz go. Jak on w ogole skurczyl sie w tym swiecie? Bedziesz musial sam sie dowiedziec. Przetrwaj i rozwijaj swoj organizm, ale nie zapomnij tez o sobie.
  ui_ruleset_description_custom: <b>Niestandardowy</b> tryb pozwala ci modyfikowac standardowa rozgrywke. Stworz swoje wlasne zasady i graj w tempie, ktore preferujesz!
  ui_ruleset_description_tip: <n>Wskazowka</n> to tryb uzywany do generowania nowych wskazowek do rozgrywki jako swiaty

  ui_ruleset_first_game_warning: "Wyglada na to, ze to twoja pierwsza gra, sugerujemy, aby najpierw sprobowac <y>pokojowego</y> swiata, zanim rzucisz sie na <r>przetrwanie</r>!"
  ui_evolution_is_working_in_progress: Ta ewolucja jest nadal w trakcie prac, moze nie dzialac, moze ulec zmianie lub zostac przeniesiona, eksploruj na wlasne ryzyko
  ui_evolution_is_a_placeholder: Ta ewolucja pojawi sie w przyszlej aktualizacji

